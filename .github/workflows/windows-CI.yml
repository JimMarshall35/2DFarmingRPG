name: Windows CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: ["SDL2", "GLFW3"]
        baked: ["ON", "OFF"]
        type: ["Release", "Debug"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - uses: hustcer/setup-nu@v3
      with:
        version: "0.111.0" # Don't use 0.90 here, as it would be a float number and would be converted to 0.9, you can use v0.90/0.90.0 or '0.90'


    - name: Install Conan
      uses: conan-io/setup-conan@v1

    - name: Install Conan dependencies
      run: |
        cd Stardew
        cmd /c "GetDependenciesConan.bat"

    - name: Stamp version
      shell: cmd
      env:
          BAKED: ${{ matrix.baked }}
          TYPE: ${{ matrix.type }} 
          PLATFORM: ${{ matrix.platform }} 
      run: |
        cd Stardew/game
        set ARGS=--platform %PLATFORM% --build_type %TYPE%
        if /I "%BAKED%"=="ON" set ARGS=%ARGS% --baked
        python make_release_version_header.py %ARGS%
        
    - name: Build
      env:
          BAKED: ${{ matrix.baked }}
          TYPE: ${{ matrix.type }} 
          PLATFORM: ${{ matrix.platform }} 
      run: |
        cd Stardew
        cmd /c "Build.bat" %TYPE% %BAKED% %PLATFORM% 

    - name: Test
      run: |
        cd ./Stardew/build/enginetest/Release
        ./StardewEngineTest.exe

    - name: Compile Assets
      run: |
        cd Stardew
        cmd /c "compile_assets.bat"

    - uses: actions/upload-artifact@v4
      with:
        name: my-artifact
        path: Stardew/build/game/Release # or path/to/artifact
