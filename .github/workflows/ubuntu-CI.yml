name: Ubuntu CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: ["SDL2", "GLFW3"]
        baked: ["ON", "OFF"]
        type: ["Release", "Debug"]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - name: Get Dependencies
      run: |
        cd Stardew
        bash GetDependencies.sh

    - name: Create version
      env:
          BAKED: ${{ matrix.baked }}
      run: |
        cd Stardew/game
        if [ "$BAKED" = "ON" ]; then
          python3 make_release_version_header.py --platform ${{ matrix.platform }} --baked
        else
          python3 make_release_version_header.py --platform ${{ matrix.platform }} 
        fi
        
    - name: Build
      run: |
        cd Stardew
        ./Build_Internal.sh Release ${{ matrix.baked }} ${{ matrix.platform }} 

    - name: Test
      run: |
        cd Stardew/build/enginetest
        ./StardewEngineTest

    - name: NetTest
      run: |
        cd Stardew
        sudo ./RunEngineNetTest.sh

    - name: Compile Assets
      run: |
        cd Stardew
        sudo ./compile_assets.sh

    - name: Build Debian Package
      run: |
        cd Stardew
        sudo ./BuildDebianPkg.sh
      
    - uses: actions/upload-artifact@v4
      with:
        name: my-artifact-${{ matrix.baked }}-${{ matrix.platform }}-${{ matrix.type }} 
        path: Stardew/*.deb

