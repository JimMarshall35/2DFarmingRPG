name: Windows CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

defaults:
  run:
    shell: nu {0}

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: ["SDL2", "GLFW3"]
        baked: ["true", "false"]
        type: ["Release", "Debug"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: hustcer/setup-nu@v3
        with:
          version: "0.111.0"

      - name: Remove unnecessary dependencies from conan
        env:
          PLATFORM: ${{ matrix.platform }}
          SDL_PACKAGE: sdl/2.30.1
          GLFW_PACKAGE: glfw/3.4
        run: |
          cd Stardew
          nu ./Makefile.nu strip_unnecessary_conan_deps $env.PLATFORM $env.SDL_PACKAGE $env.GLFW_PACKAGE

      - name: Install Conan
        uses: conan-io/setup-conan@v1

      - name: Install Conan dependencies
        run: |
          cd Stardew
          nu ./Makefile.nu get_dependencies_conan ${{ matrix.type }}

      - name: Stamp version
        env:
          BAKED: ${{ matrix.baked }}
          TYPE: ${{ matrix.type }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd Stardew
          nu ./Makefile.nu stamp_version $env.BAKED $env.PLATFORM $env.TYPE
      - name: Build
        env:
          BAKED: ${{ matrix.baked }}
          TYPE: ${{ matrix.type }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd Stardew
          nu ./Makefile.nu build_windows $env.TYPE $env.BAKED $env.PLATFORM OPENGL
      
      - name: Test
        run: |
          cd Stardew
          nu ./Makefile.nu get_dependencies_conan ${{ matrix.type }}

      - name: Compile Assets
        run: |
          cd Stardew
          nu ./Makefile.nu compile_assets_windows

      - uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: Stardew/build/install_dir