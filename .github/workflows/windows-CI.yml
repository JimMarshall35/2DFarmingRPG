name: Windows CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        platform: ["SDL2", "GLFW3"]
        baked: ["ON", "OFF"]
        type: ["Release", "Debug"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - uses: hustcer/setup-nu@v3
      with:
        version: "0.111.0" # Don't use 0.90 here, as it would be a float number and would be converted to 0.9, you can use v0.90/0.90.0 or '0.90'

    - name: Remove unncessary dependencies from conan
      shell: nu {0}
      env: 
        PLATFORM: ${{ matrix.platform }} 
        SDL_PACKAGE: sdl/2.30.1
        GLFW_PACKAGE: glfw/3.4
      run: |
        if $env.PLATFORM == "SDL2" {
          open Stardew/conanfile.txt | str replace -a $env.GLFW_PACKAGE '' | save Stardew/conanfile.txt
        }
        else if $env.PLATFORM == "GLFW3" {
          open Stardew/conanfile.txt | str replace -a $env.SDL_PACKAGE '' | save Stardew/conanfile.txt
        }
        

    - name: Install Conan
      uses: conan-io/setup-conan@v1

    - name: Install Conan dependencies
      run: |
        cd Stardew
        cmd /c "GetDependenciesConan.bat" ${{ matrix.type }} 

    - name: Stamp version
      shell: cmd
      env:
          BAKED: ${{ matrix.baked }}
          TYPE: ${{ matrix.type }} 
          PLATFORM: ${{ matrix.platform }} 
      run: |
        cd Stardew/game
        set ARGS=--platform %PLATFORM% --build_type %TYPE%
        if /I "%BAKED%"=="ON" set ARGS=%ARGS% --baked
        python make_release_version_header.py %ARGS%
        
    - name: Build
      env:
          BAKED: ${{ matrix.baked }}
          TYPE: ${{ matrix.type }} 
          PLATFORM: ${{ matrix.platform }} 
      run: |
        cd Stardew
        cmd /c "Build.bat" %TYPE% %BAKED% %PLATFORM% OPENGL

    - name: Test
      run: |
        cd ./Stardew/build/enginetest/${{ matrix.type }} 
        ./StardewEngineTest.exe

    - name: Compile Assets
      run: |
        cd Stardew
        cmd /c "compile_assets.bat"

    - uses: actions/upload-artifact@v4
      with:
        name: my-artifact
        path: Stardew/install_dir # or path/to/artifact
