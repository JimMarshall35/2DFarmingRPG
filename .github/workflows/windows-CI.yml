name: Windows CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

defaults:
  run:
    shell: nu {0}
env:
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: ["SDL2", "GLFW3"]
        baked: ["true", "false"]
        type: ["Release", "Debug"]

    # the SDL conan package doesn't compile on windows latest:
    # sdl/2.30.1: RUN: cmake -G "Visual Studio 18 2026" -DCMAKE_TOOLCHAIN_FILE="generators/conan_toolchain.cmake" -DCMAKE_INSTALL_PREFIX="D:/a/2DFarmingRPG/2DFarmingRPG/.conan2/p/b/sdla4998b09ea34a/p" -DCMAKE_POLICY_DEFAULT_CMP0077="NEW" -DCMAKE_POLICY_DEFAULT_CMP0091="NEW" "D:/a/2DFarmingRPG/2DFarmingRPG/.conan2/p/b/sdla4998b09ea34a/b/src"
    # CMake Error: Could not create named generator Visual Studio 18 2026
    runs-on: ${{ matrix.platform == 'SDL2' && 'windows-2022' || 'windows-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('Stardew/conanfile.txt') }}-${{ matrix.type }}-${{ matrix.platform }}

      - uses: hustcer/setup-nu@v3
        with:
          version: "0.111.0"

      - name: Remove unnecessary dependencies from conan
        env:
          PLATFORM: ${{ matrix.platform }}
          SDL_PACKAGE: sdl/2.30.1
          GLFW_PACKAGE: glfw/3.4
        run: |
          cd Stardew
          nu ./Makefile.nu strip_unnecessary_conan_deps $env.PLATFORM $env.SDL_PACKAGE $env.GLFW_PACKAGE

      - name: Install Conan
        uses: conan-io/setup-conan@v1

      - name: Install Conan dependencies
        run: |
          cd Stardew
          nu ./Makefile.nu get_dependencies_conan ${{ matrix.type }}

      - name: Stamp version
        env:
          BAKED: ${{ matrix.baked }}
          TYPE: ${{ matrix.type }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd Stardew
          nu ./Makefile.nu stamp_version $env.BAKED $env.PLATFORM $env.TYPE
      - name: Build
        env:
          BAKED: ${{ matrix.baked }}
          TYPE: ${{ matrix.type }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd Stardew
          nu ./Makefile.nu build_windows $env.TYPE $env.BAKED $env.PLATFORM OPENGL
      
      - name: Test
        run: |
          cd Stardew
          nu ./Makefile.nu run_tests_windows

      - name: Compile Assets
        run: |
          cd Stardew
          nu ./Makefile.nu compile_assets_windows

      - name: Upload atlas debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlascombined-${{ matrix.platform }}-${{ matrix.baked }}-${{ matrix.type }}
          path: |
            Stardew/WfAssets/out/atlascombined.xml
            Stardew/WfAssets/out/atlascombined.xml.log
          if-no-files-found: warn

      - name: Upload to itch.io
        if: matrix.platform == 'SDL2' && matrix.baked == 'false' && matrix.type == 'Release'
        run: |
          cd Stardew
          nu ./Makefile.nu itchio_butler_windows_x64

      - uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: Stardew/build/install_dir