#
#  Build an appimage using an ubuntu 20 based image and therefore an older glibc 
#  for maximum compatibility. Only build this configuration:
#  "Release baked=false GLFW3 OPENGLES"
#  and release on itch.io
name: AppImage CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/jimmarshall35/appimage-builder:latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    # - name: Stamp version
    #   run: | 
    #     cd Stardew
    #     ./Makefile.nu stamp_version false GLFW3 Release
        
    - name: Build
      run: |
        cd Stardew
        nu ./Makefile.nu build_linux Release false GLFW3 OPENGLES

    - name: Compile Assets
      run: |
        cd Stardew
        nu ./Makefile.nu compile_assets_linux
    
    - name: Build appimage
      run: |
        cd Stardew
        nu ./Makefile.nu build_appimage
    
    - name: Upload Itchio
      env: 
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      run: |
        cd Stardew
        nu ./Makefile.nu itchio_butler_appimage_x64
      
    - uses: actions/upload-artifact@v4
      with:
        name: my-artifact-appimage
        path: |
          Stardew/appimage/farming.AppImage

